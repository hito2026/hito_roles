e infraestructura", "url": "https://drive.google.com/file/d/1AStOh9WDlbuQoCGPVbnJOA5uJ7nQl_IX/view"}, {"fileId": "1RU251M_Ag9BHzm9Pgd36QGlxKlt9rizH", "filename": "DOC-OPE-Perfil-Lider-Soporte-005-V1.3 - Validado por Direccion General.docx", "title": "Líder de Soporte", "section": "1. Propósito del puesto", "paragraph": 17, "text": "Propósito: Conducir y ejecutar la operación de Soporte y Postventa Odoo, coordinando al equipo, haciendo cumplir la metodología y los niveles de servicio definidos, y respondiendo por la continuidad operativa y la experiencia de los clientes instalados.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1RU251M_Ag9BHzm9Pgd36QGlxKlt9rizH/view"}, {"fileId": "1RU251M_Ag9BHzm9Pgd36QGlxKlt9rizH", "filename": "DOC-OPE-Perfil-Lider-Soporte-005-V1.3 - Validado por Direccion General.docx", "title": "Líder de Soporte", "section": "2. Alcance y límites", "paragraph": 21, "text": "Cobertura: Los clientes instalados con servicio de soporte; la cola, los Analistas Funcionales de Soporte y Postventa; los incidentes, consultas y mejoras asignados; las transferencias desde Proyectos; y las escalaciones funcionales o técnicas asociadas.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1RU251M_Ag9BHzm9Pgd36QGlxKlt9rizH/view"}, {"fileId": "1RU251M_Ag9BHzm9Pgd36QGlxKlt9rizH", "filename": "DOC-OPE-Perfil-Lider-Soporte-005-V1.3 - Validado por Direccion General.docx", "title": "Líder de Soporte", "section": "3. Resultados y responsabilidades", "paragraph": 36, "text": "Desarrollar al equipo y convertir recurrencias, incidentes y aprendizajes en conocimiento reutilizable y mejoras del servicio.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1RU251M_Ag9BHzm9Pgd36QGlxKlt9rizH/view"}, {"fileId": "1RU251M_Ag9BHzm9Pgd36QGlxKlt9rizH", "filename": "DOC-OPE-Perfil-Lider-Soporte-005-V1.3 - Validado por Direccion General.docx", "title": "Líder de Soporte", "section": "4. Autoridad", "paragraph": 40, "text": "Decisiones que debe consultar o escalar: Cambios de SLA, catálogo, metodología, alcance, precio, contrato o compromiso comercial; modificaciones estructurales de dotación o presupuesto; conflictos de capacidad; incidentes críticos o riesgos de datos; situaciones sensibles con clientes; y desarrollos o integraciones no validados.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1RU251M_Ag9BHzm9Pgd36QGlxKlt9rizH/view"}, {"fileId": "1RU251M_Ag9BHzm9Pgd36QGlxKlt9rizH", "filename": "DOC-OPE-Perfil-Lider-Soporte-005-V1.3 - Validado por Direccion General.docx", "title": "Líder de Soporte", "section": "4. Autoridad", "paragraph": 41, "text": "Recursos, presupuesto o información bajo su responsabilidad: Capacidad y distribución del equipo de Soporte y Postventa; cola y tableros; base de conocimiento; accesos autorizados; documentación, comunicaciones y evidencias; métricas del servicio; backlog de Postventa; y seguimiento de riesgos, calidad y desarrollo del equipo.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1RU251M_Ag9BHzm9Pgd36QGlxKlt9rizH/view"}, {"fileId": "1RU251M_Ag9BHzm9Pgd36QGlxKlt9rizH", "filename": "DOC-OPE-Perfil-Lider-Soporte-005-V1.3 - Validado por Direccion General.docx", "title": "Líder de Soporte", "section": "7. Requisitos del puesto", "paragraph": 73, "text": "Experiencia deseable: Liderazgo de equipos de soporte, Customer Success, Postventa, gestión de incidentes productivos y coordinación con proyectos, desarrollos o integraciones.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1RU251M_Ag9BHzm9Pgd36QGlxKlt9rizH/view"}, {"fileId": "1RU251M_Ag9BHzm9Pgd36QGlxKlt9rizH", "filename": "DOC-OPE-Perfil-Lider-Soporte-005-V1.3 - Validado por Direccion General.docx", "title": "Líder de Soporte", "section": "7. Requisitos del puesto", "paragraph": 74, "text": "Conocimientos técnicos indispensables: Conocimiento funcional sólido de Odoo y procesos empresariales; gestión de tickets y SLA; diagnóstico y análisis de causa; pruebas; documentación; comunicación de incidentes; cambios en producción; métricas de servicio; planificación de capacidad y mejora continua.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1RU251M_Ag9BHzm9Pgd36QGlxKlt9rizH/view"}, {"fileId": "1RU251M_Ag9BHzm9Pgd36QGlxKlt9rizH", "filename": "DOC-OPE-Perfil-Lider-Soporte-005-V1.3 - Validado por Direccion General.docx", "title": "Líder de Soporte", "section": "7. Requisitos del puesto", "paragraph": 75, "text": "Conocimientos deseables: Certificación Odoo; gestión de servicios o prácticas ITIL; conocimientos generales de desarrollo Odoo, integraciones y soluciones IA para conducir escalaciones; gestión del cambio; bases de conocimiento; gestión de incidentes y problemas.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1RU251M_Ag9BHzm9Pgd36QGlxKlt9rizH/view"}, {"fileId": "1RU251M_Ag9BHzm9Pgd36QGlxKlt9rizH", "filename": "DOC-OPE-Perfil-Lider-Soporte-005-V1.3 - Validado por Direccion General.docx", "title": "Líder de Soporte", "section": "7. Requisitos del puesto", "paragraph": 77, "text": "Otros requisitos objetivos: Disponibilidad para coordinación diaria, reuniones con clientes, incidentes críticos y cambios planificados, en modalidad Mixto.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1RU251M_Ag9BHzm9Pgd36QGlxKlt9rizH/view"}, {"fileId": "1aNjY3hbpDt3Ql9AZCW4UpxWi-cMRdMpK", "filename": "DOC-OPE-Perfil-Responsable-Postventa-004-V1.1 - Validado por Direccion General.docx", "title": "Responsable de Postventa", "section": "1. Propósito del puesto", "paragraph": 16, "text": "Propósito: Ejecutar de punta a punta las ampliaciones y mejoras funcionales confirmadas para clientes instalados, transformando la oportunidad comercial en una solución implementada, adoptada y cerrada con trazabilidad, calidad y continuidad operativa.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1aNjY3hbpDt3Ql9AZCW4UpxWi-cMRdMpK/view"}, {"fileId": "1aNjY3hbpDt3Ql9AZCW4UpxWi-cMRdMpK", "filename": "DOC-OPE-Perfil-Responsable-Postventa-004-V1.1 - Validado por Direccion General.docx", "title": "Responsable de Postventa", "section": "2. Alcance y límites", "paragraph": 19, "text": "No incluye: Atender la cola general de incidentes de Soporte; confirmar precios, descuentos, contratos o condiciones comerciales; definir la estrategia, metodología, capacidad o prioridades generales del área; programar desarrollos; aprobar arquitectura o cambios productivos no autorizados; ni comprometer alcance, esfuerzo o fechas fuera de las atribuciones acordadas. Estos asuntos se escalan al Líder de Soporte o al área responsable.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1aNjY3hbpDt3Ql9AZCW4UpxWi-cMRdMpK/view"}, {"fileId": "1aNjY3hbpDt3Ql9AZCW4UpxWi-cMRdMpK", "filename": "DOC-OPE-Perfil-Responsable-Postventa-004-V1.1 - Validado por Direccion General.docx", "title": "Responsable de Postventa", "section": "2. Alcance y límites", "paragraph": 20, "text": "Cobertura: Oportunidades de upselling confirmadas para clientes instalados; mejoras, nuevos módulos y microproyectos postventa asignados; ambientes y accesos autorizados; y las intervenciones funcionales o técnicas necesarias hasta su cierre.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1aNjY3hbpDt3Ql9AZCW4UpxWi-cMRdMpK/view"}, {"fileId": "1aNjY3hbpDt3Ql9AZCW4UpxWi-cMRdMpK", "filename": "DOC-OPE-Perfil-Responsable-Postventa-004-V1.1 - Validado por Direccion General.docx", "title": "Responsable de Postventa", "section": "3. Resultados y responsabilidades", "paragraph": 29, "text": "Relevar, modelar, configurar, probar y documentar la solución funcional aprobada, preservando la continuidad operativa del cliente.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1aNjY3hbpDt3Ql9AZCW4UpxWi-cMRdMpK/view"}, {"fileId": "1aNjY3hbpDt3Ql9AZCW4UpxWi-cMRdMpK", "filename": "DOC-OPE-Perfil-Responsable-Postventa-004-V1.1 - Validado por Direccion General.docx", "title": "Responsable de Postventa", "section": "4. Autoridad", "paragraph": 38, "text": "Decisiones que puede tomar: Organizar el trabajo asignado dentro de las prioridades acordadas; solicitar información y accesos; conducir relevamientos y validaciones; definir alternativas funcionales estándar; coordinar responsables, seguimientos y comunicaciones; proponer ajustes de plan; solicitar intervención técnica; validar entregas; y cerrar el trabajo con aceptación o motivo registrado.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1aNjY3hbpDt3Ql9AZCW4UpxWi-cMRdMpK/view"}, {"fileId": "1aNjY3hbpDt3Ql9AZCW4UpxWi-cMRdMpK", "filename": "DOC-OPE-Perfil-Responsable-Postventa-004-V1.1 - Validado por Direccion General.docx", "title": "Responsable de Postventa", "section": "4. Autoridad", "paragraph": 39, "text": "Decisiones que debe consultar o escalar: Cambios de alcance, precio, contrato, prioridad, capacidad o fecha comprometida; riesgos productivos, de datos, seguridad o accesos; desarrollos o integraciones no previstos; arquitectura y despliegues sensibles; bloqueos de otras áreas; disconformidad relevante del cliente; y compromisos no validados.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/1aNjY3hbpDt3Ql9AZCW4UpxWi-cMRdMpK/view"}, {"fileId": "1aNjY3hbpDt3Ql9AZCW4UpxWi-cMRdMpK", "filename": "DOC-OPE-Perfil-Responsable-Postventa-004-V1.1 - Validado por Direccion General.docx", "title": "Responsable de Postventa", "section": "4. Autoridad", "paragraph": 40, "text": "Recursos, presupuesto o información bajo su responsabilidad: Oportunidades y trabajos postventa asignados; plan, alcance, dependencias, comunicaciones, documentación, pruebas y evidencias; ambientes y accesos autorizados; y seguimiento hasta el cierre. No administra presupuesto, dotación ni capacidad del equipo.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1aNjY3hbpDt3Ql9AZCW4UpxWi-cMRdMpK/view"}, {"fileId": "1aNjY3hbpDt3Ql9AZCW4UpxWi-cMRdMpK", "filename": "DOC-OPE-Perfil-Responsable-Postventa-004-V1.1 - Validado por Direccion General.docx", "title": "Responsable de Postventa", "section": "7. Requisitos del puesto", "paragraph": 71, "text": "Experiencia indispensable: Experiencia comprobable en implementación funcional de Odoo o de otros ERP para clientes en producción, con participación directa en relevamiento, configuración, pruebas, capacitación, salida o estabilización.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1aNjY3hbpDt3Ql9AZCW4UpxWi-cMRdMpK/view"}, {"fileId": "1aNjY3hbpDt3Ql9AZCW4UpxWi-cMRdMpK", "filename": "DOC-OPE-Perfil-Responsable-Postventa-004-V1.1 - Validado por Direccion General.docx", "title": "Responsable de Postventa", "section": "7. Requisitos del puesto", "paragraph": 74, "text": "Conocimientos deseables: Conocimiento transversal de módulos Odoo, estimación funcional, preventa, CRM, gestión de proyectos, integraciones, despliegues, mejora continua y certificación Odoo.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/1aNjY3hbpDt3Ql9AZCW4UpxWi-cMRdMpK/view"}, {"fileId": "1aNjY3hbpDt3Ql9AZCW4UpxWi-cMRdMpK", "filename": "DOC-OPE-Perfil-Responsable-Postventa-004-V1.1 - Validado por Direccion General.docx", "title": "Responsable de Postventa", "section": "8. Competencias observables", "paragraph": 88, "text": "Planifica pruebas y cambios, protege la continuidad y registra alcance, decisiones, evidencias y resultados.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1aNjY3hbpDt3Ql9AZCW4UpxWi-cMRdMpK/view"}, {"fileId": "11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn", "filename": "DOC-TEC-Perfil-Desarrollador-IA-003-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador IA", "section": "1. Propósito del puesto", "paragraph": 17, "text": "Propósito: Construir, integrar, probar, desplegar y mantener soluciones de inteligencia artificial y automatización seguras, observables y sostenibles y, mientras no esté activo el puesto de Soporte de Soluciones IA, asegurar también la gestión punta a punta de sus consultas e incidentes.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn/view"}, {"fileId": "11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn", "filename": "DOC-TEC-Perfil-Desarrollador-IA-003-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador IA", "section": "2. Alcance y límites", "paragraph": 19, "text": "Incluye: Participar en la Daily Meeting (DM); analizar especificaciones; estimar, investigar, prototipar, diseñar, desarrollar, integrar, evaluar, probar, desplegar y documentar soluciones; diseñar integraciones robustas; monitorear y corregir defectos; y, durante el esquema transitorio, recibir, diagnosticar, mitigar, comunicar, coordinar, validar y cerrar tickets de Soporte de Soluciones IA.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn/view"}, {"fileId": "11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn", "filename": "DOC-TEC-Perfil-Desarrollador-IA-003-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador IA", "section": "2. Alcance y límites", "paragraph": 20, "text": "No incluye: Definir estrategia, arquitectura o metodología general; aprobar datos no autorizados; comprometer precio, costo o fecha; coordinar la DM o distribuir trabajo; ni cambiar producción sin autorización. Durante el esquema transitorio sí asume el ownership de soporte IA; cuando se active el puesto especializado, transferirá esa operación y conservará el desarrollo, la evolución y las escalaciones técnicas.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn/view"}, {"fileId": "11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn", "filename": "DOC-TEC-Perfil-Desarrollador-IA-003-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador IA", "section": "2. Alcance y límites", "paragraph": 21, "text": "Cobertura: Agentes, asistentes, automatizaciones inteligentes, soluciones generativas, recuperación de conocimiento, componentes de aprendizaje automático, integraciones, evaluaciones y flujos de datos para proyectos y productos, más el soporte de las soluciones IA desplegadas mientras el puesto especializado permanezca no vigente.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn/view"}, {"fileId": "11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn", "filename": "DOC-TEC-Perfil-Desarrollador-IA-003-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador IA", "section": "3. Resultados y responsabilidades", "paragraph": 30, "text": "Diseñar y construir soluciones e integraciones robustas, con contratos de datos, autenticación, idempotencia, reintentos y recuperación ante fallas parciales cuando corresponda.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn/view"}, {"fileId": "11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn", "filename": "DOC-TEC-Perfil-Desarrollador-IA-003-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador IA", "section": "3. Resultados y responsabilidades", "paragraph": 31, "text": "Código y configuración revisados; controles de resiliencia y seguridad probados; dependencias y fallas esperables documentadas.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn/view"}, {"fileId": "11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn", "filename": "DOC-TEC-Perfil-Desarrollador-IA-003-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador IA", "section": "3. Resultados y responsabilidades", "paragraph": 32, "text": "Evaluar calidad, seguridad, costo, rendimiento y comportamiento de la solución antes y después del despliegue autorizado.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn/view"}, {"fileId": "11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn", "filename": "DOC-TEC-Perfil-Desarrollador-IA-003-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador IA", "section": "3. Resultados y responsabilidades", "paragraph": 33, "text": "Evaluaciones y pruebas trazables; límites conocidos; monitoreo y criterios de reversión disponibles.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn/view"}, {"fileId": "11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn", "filename": "DOC-TEC-Perfil-Desarrollador-IA-003-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador IA", "section": "4. Autoridad", "paragraph": 40, "text": "Decisiones que debe consultar o escalar: Nuevos modelos, proveedores, librerías o servicios; uso de datos personales, sensibles o no autorizados; riesgos éticos, legales, de seguridad, sesgo o privacidad; costos no previstos; cambios de arquitectura o producción; desvíos relevantes; criterios incompletos; resultados que no alcanzan el umbral aprobado; y compromisos externos no validados.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn/view"}, {"fileId": "11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn", "filename": "DOC-TEC-Perfil-Desarrollador-IA-003-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador IA", "section": "4. Autoridad", "paragraph": 41, "text": "Recursos, presupuesto o información bajo su responsabilidad: Tareas y tickets de Soluciones IA; código, prompts, configuraciones, evaluaciones, pruebas y documentación; repositorios, modelos, entornos, logs, telemetría y accesos autorizados; comunicaciones y base de conocimiento. No administra presupuesto ni compromisos comerciales.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn/view"}, {"fileId": "11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn", "filename": "DOC-TEC-Perfil-Desarrollador-IA-003-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador IA", "section": "5. Relaciones principales", "paragraph": 47, "text": "Recibir prioridades y estándares; elevar riesgos, capacidad, arquitectura, incidentes y excepciones.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn/view"}, {"fileId": "11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn", "filename": "DOC-TEC-Perfil-Desarrollador-IA-003-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador IA", "section": "6. Indicadores de éxito", "paragraph": 65, "text": "Calidad, resiliencia y seguridad", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn/view"}, {"fileId": "11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn", "filename": "DOC-TEC-Perfil-Desarrollador-IA-003-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador IA", "section": "6. Indicadores de éxito", "paragraph": 66, "text": "Entregar soluciones evaluadas, observables y recuperables ante fallas previsibles, sin riesgos no controlados.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn/view"}, {"fileId": "11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn", "filename": "DOC-TEC-Perfil-Desarrollador-IA-003-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador IA", "section": "6. Indicadores de éxito", "paragraph": 67, "text": "Pruebas, evaluaciones, monitoreo e incidentes", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn/view"}, {"fileId": "11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn", "filename": "DOC-TEC-Perfil-Desarrollador-IA-003-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador IA", "section": "6. Indicadores de éxito", "paragraph": 68, "text": "Continuidad y soporte transitorio", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn/view"}, {"fileId": "11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn", "filename": "DOC-TEC-Perfil-Desarrollador-IA-003-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador IA", "section": "7. Requisitos del puesto", "paragraph": 73, "text": "Experiencia deseable: Experiencia con agentes, modelos generativos, RAG, integraciones empresariales, procesamiento de lenguaje, aprendizaje automático, servicios en nube, ambientes productivos y resolución de incidentes técnicos escalados.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn/view"}, {"fileId": "11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn", "filename": "DOC-TEC-Perfil-Desarrollador-IA-003-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador IA", "section": "7. Requisitos del puesto", "paragraph": 74, "text": "Conocimientos técnicos indispensables: Python; APIs, webhooks e integraciones; contratos y flujos de datos; autenticación; idempotencia, reintentos y recuperación ante fallas parciales; modelos generativos, agentes, RAG y evaluación; Git; pruebas; observabilidad; diagnóstico de incidentes; documentación; seguridad, privacidad, costo y rendimiento.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn/view"}, {"fileId": "11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn", "filename": "DOC-TEC-Perfil-Desarrollador-IA-003-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador IA", "section": "7. Requisitos del puesto", "paragraph": 75, "text": "Conocimientos deseables: Aprendizaje automático; MLOps o LLMOps; bases vectoriales; frameworks de agentes y evaluación; Docker; Linux; CI/CD; nube; colas y procesos asíncronos; serving de modelos; gobierno de datos; y optimización de calidad, latencia y costo.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn/view"}, {"fileId": "11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn", "filename": "DOC-TEC-Perfil-Desarrollador-IA-003-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador IA", "section": "7. Requisitos del puesto", "paragraph": 77, "text": "Otros requisitos objetivos: Disponibilidad para coordinación diaria, revisión técnica e intervención en experimentos, despliegues o incidentes planificados según la organización del servicio, utilizando únicamente datos, accesos y entornos autorizados, en modalidad Mixto.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn/view"}, {"fileId": "11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn", "filename": "DOC-TEC-Perfil-Desarrollador-IA-003-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador IA", "section": "9. Validación", "paragraph": 100, "text": "Documentos relacionados: Perfil del Director Técnico e IA; perfil futuro de Soporte de Soluciones IA; perfiles funcionales de Proyectos y Comercial; organigrama; matriz Dirección–Liderazgo–Ejecución; arquitectura y catálogo de IA; estándares de desarrollo, integración, datos, seguridad, evaluación, observabilidad, soporte, incidentes, documentación y despliegue.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/11MN0w1LfSBoyg0TE1t4vx5BShajZhQkn/view"}, {"fileId": "11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt", "filename": "DOC-TEC-Perfil-Desarrollador-Odoo-002-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador Odoo", "section": "2. Alcance y límites", "paragraph": 19, "text": "Incluye: Participar en la Daily Meeting (DM); analizar la especificación funcional; aclarar supuestos; estimar y planificar; diseñar y desarrollar; crear pruebas unitarias y de regresión; participar en revisiones de código; mantener trazabilidad entre ticket, rama, commit y versión desplegada; corregir defectos mediante análisis de causa raíz; documentar; preparar despliegues autorizados; comunicar avances; y transferir conocimiento técnico a Soporte.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt/view"}, {"fileId": "11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt", "filename": "DOC-TEC-Perfil-Desarrollador-Odoo-002-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador Odoo", "section": "2. Alcance y límites", "paragraph": 20, "text": "No incluye: Definir con el cliente el alcance funcional; actuar como PM del proyecto o ticket; centralizar la comunicación con el cliente; confirmar precios, esfuerzo o fechas comerciales; definir la estrategia, arquitectura o metodología general del área; coordinar la DM o distribuir trabajo a otras personas; ni ejecutar cambios productivos sin autorización. Estos asuntos corresponden al responsable funcional, al liderazgo operativo o a la Dirección Técnica e IA.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt/view"}, {"fileId": "11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt", "filename": "DOC-TEC-Perfil-Desarrollador-Odoo-002-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador Odoo", "section": "3. Resultados y responsabilidades", "paragraph": 31, "text": "Código legible y mantenible; solución alineada; trazabilidad entre ticket, rama, commit y versión desplegada.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt/view"}, {"fileId": "11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt", "filename": "DOC-TEC-Perfil-Desarrollador-Odoo-002-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador Odoo", "section": "3. Resultados y responsabilidades", "paragraph": 33, "text": "Pruebas y revisión registradas; criterios de calidad y seguridad cumplidos; defectos críticos resueltos.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt/view"}, {"fileId": "11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt", "filename": "DOC-TEC-Perfil-Desarrollador-Odoo-002-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador Odoo", "section": "3. Resultados y responsabilidades", "paragraph": 34, "text": "Documentar decisiones, dependencias, instalación, uso y reversión; preparar la entrega y transferir conocimiento técnico a Soporte.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt/view"}, {"fileId": "11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt", "filename": "DOC-TEC-Perfil-Desarrollador-Odoo-002-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador Odoo", "section": "3. Resultados y responsabilidades", "paragraph": 35, "text": "Documentación reproducible; evidencia de entrega o despliegue; transferencia registrada y utilizable.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt/view"}, {"fileId": "11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt", "filename": "DOC-TEC-Perfil-Desarrollador-Odoo-002-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador Odoo", "section": "3. Resultados y responsabilidades", "paragraph": 36, "text": "Investigar y corregir defectos o incidentes escalados mediante análisis de causa raíz y devolver la solución probada al responsable funcional.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt/view"}, {"fileId": "11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt", "filename": "DOC-TEC-Perfil-Desarrollador-Odoo-002-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador Odoo", "section": "4. Autoridad", "paragraph": 40, "text": "Decisiones que debe consultar o escalar: Cambios de arquitectura, alcance o criterio funcional; dependencias, servicios o librerías nuevas; riesgos de seguridad, datos, rendimiento o continuidad; modificaciones en producción; desvíos relevantes de esfuerzo o fecha; especificaciones incompletas; bloqueos; y cualquier compromiso con el cliente no validado.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt/view"}, {"fileId": "11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt", "filename": "DOC-TEC-Perfil-Desarrollador-Odoo-002-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador Odoo", "section": "4. Autoridad", "paragraph": 41, "text": "Recursos, presupuesto o información bajo su responsabilidad: Tareas técnicas asignadas; código, ramas, pruebas, revisiones y documentación; repositorios, entornos y accesos autorizados; y evidencia de entrega. No administra presupuesto, cartera, capacidad del equipo ni compromisos funcionales o comerciales.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt/view"}, {"fileId": "11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt", "filename": "DOC-TEC-Perfil-Desarrollador-Odoo-002-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador Odoo", "section": "6. Indicadores de éxito", "paragraph": 67, "text": "Repositorio, CI, pruebas e incidentes", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt/view"}, {"fileId": "11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt", "filename": "DOC-TEC-Perfil-Desarrollador-Odoo-002-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador Odoo", "section": "7. Requisitos del puesto", "paragraph": 73, "text": "Experiencia deseable: Experiencia con distintas versiones de Odoo, localización argentina, migraciones, APIs, integraciones, optimización, ambientes productivos y resolución de incidentes escalados.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt/view"}, {"fileId": "11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt", "filename": "DOC-TEC-Perfil-Desarrollador-Odoo-002-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador Odoo", "section": "7. Requisitos del puesto", "paragraph": 74, "text": "Conocimientos técnicos indispensables: Python; framework Odoo; ORM, modelos, vistas, seguridad y módulos; PostgreSQL; Git; APIs e integraciones; pruebas unitarias y de regresión; depuración y análisis de causa raíz; revisión de código; trazabilidad de versiones; documentación técnica; y fundamentos de seguridad, rendimiento y despliegue.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt/view"}, {"fileId": "11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt", "filename": "DOC-TEC-Perfil-Desarrollador-Odoo-002-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador Odoo", "section": "7. Requisitos del puesto", "paragraph": 75, "text": "Conocimientos deseables: JavaScript y frontend Odoo; XML y QWeb; Docker; Linux; CI/CD; observabilidad; colas y procesos asíncronos; localización; migraciones; automatización y prácticas DevOps.", "kind": "Referencia explícita a Infraestructura / DevOps", "url": "https://drive.google.com/file/d/11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt/view"}, {"fileId": "11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt", "filename": "DOC-TEC-Perfil-Desarrollador-Odoo-002-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador Odoo", "section": "7. Requisitos del puesto", "paragraph": 77, "text": "Otros requisitos objetivos: Disponibilidad para coordinación diaria, revisión de código e intervención en incidentes o cambios planificados según la organización del servicio, en modalidad Mixto.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt/view"}, {"fileId": "11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt", "filename": "DOC-TEC-Perfil-Desarrollador-Odoo-002-V1.2 - Validado por Direccion General.docx", "title": "Desarrollador Odoo", "section": "9. Validación", "paragraph": 100, "text": "Documentos relacionados: Perfil del Director Técnico e IA; perfiles funcionales de Proyectos, Soporte y Postventa; organigrama; matriz Dirección–Liderazgo–Ejecución; arquitectura Odoo; estándares de desarrollo, seguridad, pruebas, revisión, documentación y despliegue; definición de terminado; y matriz de escalamiento.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/11I1DhdqD3uvnXwwFbxxeMlfm1QrAuCSt/view"}, {"fileId": "1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9", "filename": "DOC-TEC-Perfil-Director-Tecnico-IA-001-V1.1 - Validado por Direccion General.docx", "title": "Director Técnico e IA", "section": "2. Alcance y límites", "paragraph": 18, "text": "Incluye: Definir estrategia y roadmap tecnológico; establecer arquitectura, estándares y metodología de desarrollo, IA, integraciones, pruebas, seguridad, despliegue, observabilidad y documentación; gobernar el portafolio y la capacidad; controlar resultados, riesgos, deuda y continuidad; validar excepciones; y diseñar la estructura y las capacidades del área.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9/view"}, {"fileId": "1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9", "filename": "DOC-TEC-Perfil-Director-Tecnico-IA-001-V1.1 - Validado por Direccion General.docx", "title": "Director Técnico e IA", "section": "2. Alcance y límites", "paragraph": 20, "text": "Cobertura: Desarrollos Odoo, integraciones, soluciones y productos de IA, infraestructura, entornos, repositorios, prácticas de ingeniería, seguridad técnica y servicios tecnológicos internos o destinados a clientes.", "kind": "Referencia explícita a Infraestructura / DevOps", "url": "https://drive.google.com/file/d/1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9/view"}, {"fileId": "1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9", "filename": "DOC-TEC-Perfil-Director-Tecnico-IA-001-V1.1 - Validado por Direccion General.docx", "title": "Director Técnico e IA", "section": "3. Resultados y responsabilidades", "paragraph": 27, "text": "Establecer y mantener la arquitectura de referencia y los criterios para evaluar soluciones, integraciones, infraestructura y productos de IA.", "kind": "Referencia explícita a Infraestructura / DevOps", "url": "https://drive.google.com/file/d/1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9/view"}, {"fileId": "1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9", "filename": "DOC-TEC-Perfil-Director-Tecnico-IA-001-V1.1 - Validado por Direccion General.docx", "title": "Director Técnico e IA", "section": "3. Resultados y responsabilidades", "paragraph": 29, "text": "Definir la metodología y los estándares de ingeniería, calidad, seguridad, pruebas, revisión, despliegue, observabilidad y documentación.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9/view"}, {"fileId": "1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9", "filename": "DOC-TEC-Perfil-Director-Tecnico-IA-001-V1.1 - Validado por Direccion General.docx", "title": "Director Técnico e IA", "section": "3. Resultados y responsabilidades", "paragraph": 33, "text": "Controlar los resultados agregados del área, la calidad de las entregas, la continuidad, la seguridad, la deuda técnica y la mejora continua.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9/view"}, {"fileId": "1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9", "filename": "DOC-TEC-Perfil-Director-Tecnico-IA-001-V1.1 - Validado por Direccion General.docx", "title": "Director Técnico e IA", "section": "3. Resultados y responsabilidades", "paragraph": 34, "text": "Indicadores y revisiones periódicas; incidentes y causas analizados; planes de mejora con responsables y seguimiento.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9/view"}, {"fileId": "1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9", "filename": "DOC-TEC-Perfil-Director-Tecnico-IA-001-V1.1 - Validado por Direccion General.docx", "title": "Director Técnico e IA", "section": "4. Autoridad", "paragraph": 38, "text": "Decisiones que puede tomar: Definir estándares, patrones, herramientas y controles técnicos; aprobar arquitecturas y excepciones dentro de la estrategia y el presupuesto vigentes; establecer criterios de estimación y calidad; requerir correcciones; detener una liberación que comprometa seguridad, continuidad o mantenibilidad; y devolver requerimientos sin definición funcional suficiente.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9/view"}, {"fileId": "1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9", "filename": "DOC-TEC-Perfil-Director-Tecnico-IA-001-V1.1 - Validado por Direccion General.docx", "title": "Director Técnico e IA", "section": "4. Autoridad", "paragraph": 39, "text": "Decisiones que debe consultar o escalar: Cambios de estrategia o presupuesto; compromisos comerciales; prioridades entre áreas; modificaciones de alcance funcional; incorporaciones o cambios relevantes de estructura; proveedores o infraestructura de alto impacto; riesgos críticos de seguridad, datos o continuidad; y excepciones que excedan la autoridad aprobada.", "kind": "Referencia explícita a Infraestructura / DevOps", "url": "https://drive.google.com/file/d/1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9/view"}, {"fileId": "1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9", "filename": "DOC-TEC-Perfil-Director-Tecnico-IA-001-V1.1 - Validado por Direccion General.docx", "title": "Director Técnico e IA", "section": "4. Autoridad", "paragraph": 40, "text": "Recursos, presupuesto o información bajo su responsabilidad: Roadmap y portafolio técnico; capacidad e indicadores del área; repositorios, infraestructura, entornos, accesos y documentación técnica; estándares y decisiones de arquitectura; proveedores y presupuesto técnico aprobado. No administra el presupuesto general de la compañía ni define condiciones comerciales.", "kind": "Referencia explícita a Infraestructura / DevOps", "url": "https://drive.google.com/file/d/1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9/view"}, {"fileId": "1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9", "filename": "DOC-TEC-Perfil-Director-Tecnico-IA-001-V1.1 - Validado por Direccion General.docx", "title": "Director Técnico e IA", "section": "6. Indicadores de éxito", "paragraph": 64, "text": "Calidad, seguridad y continuidad", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9/view"}, {"fileId": "1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9", "filename": "DOC-TEC-Perfil-Director-Tecnico-IA-001-V1.1 - Validado por Direccion General.docx", "title": "Director Técnico e IA", "section": "6. Indicadores de éxito", "paragraph": 65, "text": "Sostener estándares y controles, reducir fallas y retrabajos evitables y gestionar incidentes y riesgos críticos.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9/view"}, {"fileId": "1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9", "filename": "DOC-TEC-Perfil-Director-Tecnico-IA-001-V1.1 - Validado por Direccion General.docx", "title": "Director Técnico e IA", "section": "6. Indicadores de éxito", "paragraph": 66, "text": "Repositorio, CI, incidentes y observabilidad", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9/view"}, {"fileId": "1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9", "filename": "DOC-TEC-Perfil-Director-Tecnico-IA-001-V1.1 - Validado por Direccion General.docx", "title": "Director Técnico e IA", "section": "7. Requisitos del puesto", "paragraph": 71, "text": "Experiencia indispensable: Experiencia sólida en arquitectura y desarrollo de software, infraestructura y gobierno técnico, con responsabilidad sobre estándares, riesgos, capacidad y resultados de equipos o áreas tecnológicas.", "kind": "Referencia explícita a Infraestructura / DevOps", "url": "https://drive.google.com/file/d/1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9/view"}, {"fileId": "1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9", "filename": "DOC-TEC-Perfil-Director-Tecnico-IA-001-V1.1 - Validado por Direccion General.docx", "title": "Director Técnico e IA", "section": "7. Requisitos del puesto", "paragraph": 73, "text": "Conocimientos técnicos indispensables: Arquitectura de software e integraciones; prácticas de ingeniería; diseño y revisión de soluciones; estimación y capacidad; calidad y pruebas; seguridad; infraestructura, despliegue y observabilidad; gestión de riesgos, deuda y continuidad; y gobierno de portafolio técnico.", "kind": "Referencia explícita a Infraestructura / DevOps", "url": "https://drive.google.com/file/d/1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9/view"}, {"fileId": "1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9", "filename": "DOC-TEC-Perfil-Director-Tecnico-IA-001-V1.1 - Validado por Direccion General.docx", "title": "Director Técnico e IA", "section": "7. Requisitos del puesto", "paragraph": 74, "text": "Conocimientos deseables: Odoo y su arquitectura; Python; APIs; nube y automatización; datos, modelos de IA, agentes, LLMOps o MLOps; finanzas de tecnología; gestión de proveedores; gobierno y cumplimiento.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9/view"}, {"fileId": "1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9", "filename": "DOC-TEC-Perfil-Director-Tecnico-IA-001-V1.1 - Validado por Direccion General.docx", "title": "Director Técnico e IA", "section": "7. Requisitos del puesto", "paragraph": 76, "text": "Otros requisitos objetivos: Disponibilidad para reuniones de Dirección, decisiones ante incidentes técnicos críticos y coordinación con clientes o proveedores cuando el riesgo lo requiera, en modalidad Mixto.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9/view"}, {"fileId": "1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9", "filename": "DOC-TEC-Perfil-Director-Tecnico-IA-001-V1.1 - Validado por Direccion General.docx", "title": "Director Técnico e IA", "section": "8. Competencias observables", "paragraph": 84, "text": "Evalúa alternativas y explicita valor, costo, riesgo, seguridad, mantenibilidad, capacidad y deuda antes de decidir.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9/view"}, {"fileId": "1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9", "filename": "DOC-TEC-Perfil-Director-Tecnico-IA-001-V1.1 - Validado por Direccion General.docx", "title": "Director Técnico e IA", "section": "9. Validación", "paragraph": 99, "text": "Documentos relacionados: Perfil de Dirección General; organigrama; matriz Dirección–Liderazgo–Ejecución; estrategia y roadmap tecnológico; arquitectura de referencia; estándares de desarrollo, IA, seguridad, pruebas, despliegue y documentación; matriz de autoridad; planificación de capacidad; y interfaces Proyectos–Soporte–Comercial–Técnica.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/1y9nmGxFZ7mdvIRIpy4euIo4RRdRVEde9/view"}, {"fileId": "1EYQPvr917Xs0lFVapdDpb69cefEux_2w", "filename": "DOC-TEC-Perfil-Soporte-Soluciones-IA-004-V1.2 - Puesto futuro - Validado por Direccion General.docx", "title": "Soporte de Soluciones IA", "section": "1. Propósito del puesto", "paragraph": 17, "text": "Propósito: Asegurar la continuidad operativa y la experiencia de usuarios y clientes sobre soluciones de inteligencia artificial ya desplegadas, gestionando cada caso de soporte de punta a punta, con diagnóstico basado en evidencia, comunicación clara, resolución segura y prevención de recurrencias.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/1EYQPvr917Xs0lFVapdDpb69cefEux_2w/view"}, {"fileId": "1EYQPvr917Xs0lFVapdDpb69cefEux_2w", "filename": "DOC-TEC-Perfil-Soporte-Soluciones-IA-004-V1.2 - Puesto futuro - Validado por Direccion General.docx", "title": "Soporte de Soluciones IA", "section": "2. Alcance y límites", "paragraph": 19, "text": "Incluye: Participar en la Daily Meeting (DM); gestionar tickets asignados según prioridades y SLA vigentes; recibir, reproducir y diagnosticar incidentes o consultas; analizar logs, telemetría, datos autorizados e integraciones; asistir a usuarios; aplicar configuraciones o mitigaciones autorizadas; centralizar la comunicación; coordinar escalaciones; validar la solución; cerrar el caso; y mantener documentación y base de conocimiento.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/1EYQPvr917Xs0lFVapdDpb69cefEux_2w/view"}, {"fileId": "1EYQPvr917Xs0lFVapdDpb69cefEux_2w", "filename": "DOC-TEC-Perfil-Soporte-Soluciones-IA-004-V1.2 - Puesto futuro - Validado por Direccion General.docx", "title": "Soporte de Soluciones IA", "section": "2. Alcance y límites", "paragraph": 20, "text": "No incluye: Definir estrategia, arquitectura o metodología; administrar la cola completa, capacidad o dotación; construir nuevas funcionalidades o productos; realizar desarrollos significativos; atender soporte funcional Odoo ajeno a la solución de IA; aprobar cambios de alcance o condiciones comerciales; coordinar la DM o distribuir trabajo; usar datos no autorizados; ni ejecutar cambios productivos de alto riesgo sin aprobación.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1EYQPvr917Xs0lFVapdDpb69cefEux_2w/view"}, {"fileId": "1EYQPvr917Xs0lFVapdDpb69cefEux_2w", "filename": "DOC-TEC-Perfil-Soporte-Soluciones-IA-004-V1.2 - Puesto futuro - Validado por Direccion General.docx", "title": "Soporte de Soluciones IA", "section": "3. Resultados y responsabilidades", "paragraph": 28, "text": "Conservar el ownership punta a punta de cada ticket de Soluciones IA, incluso cuando la ejecución técnica se escale a Desarrollo IA, Odoo, infraestructura o un proveedor.", "kind": "Referencia explícita a Infraestructura / DevOps", "url": "https://drive.google.com/file/d/1EYQPvr917Xs0lFVapdDpb69cefEux_2w/view"}, {"fileId": "1EYQPvr917Xs0lFVapdDpb69cefEux_2w", "filename": "DOC-TEC-Perfil-Soporte-Soluciones-IA-004-V1.2 - Puesto futuro - Validado por Direccion General.docx", "title": "Soporte de Soluciones IA", "section": "3. Resultados y responsabilidades", "paragraph": 30, "text": "Diagnosticar consultas, degradaciones e incidentes a partir de evidencia y diferenciar síntoma, causa, alcance e impacto real.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1EYQPvr917Xs0lFVapdDpb69cefEux_2w/view"}, {"fileId": "1EYQPvr917Xs0lFVapdDpb69cefEux_2w", "filename": "DOC-TEC-Perfil-Soporte-Soluciones-IA-004-V1.2 - Puesto futuro - Validado por Direccion General.docx", "title": "Soporte de Soluciones IA", "section": "3. Resultados y responsabilidades", "paragraph": 31, "text": "Reproducción, ambiente, logs, telemetría, datos autorizados, hipótesis y diagnóstico o criterio de escalamiento documentados.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/1EYQPvr917Xs0lFVapdDpb69cefEux_2w/view"}, {"fileId": "1EYQPvr917Xs0lFVapdDpb69cefEux_2w", "filename": "DOC-TEC-Perfil-Soporte-Soluciones-IA-004-V1.2 - Puesto futuro - Validado por Direccion General.docx", "title": "Soporte de Soluciones IA", "section": "3. Resultados y responsabilidades", "paragraph": 37, "text": "Artículos y procedimientos actualizados; recurrencias identificadas; acciones preventivas, monitoreo o correcciones permanentes vinculadas.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/1EYQPvr917Xs0lFVapdDpb69cefEux_2w/view"}, {"fileId": "1EYQPvr917Xs0lFVapdDpb69cefEux_2w", "filename": "DOC-TEC-Perfil-Soporte-Soluciones-IA-004-V1.2 - Puesto futuro - Validado por Direccion General.docx", "title": "Soporte de Soluciones IA", "section": "4. Autoridad", "paragraph": 39, "text": "Decisiones que puede tomar: Organizar sus casos asignados dentro de las prioridades vigentes; solicitar evidencia, accesos o contexto; ejecutar diagnósticos no destructivos; reproducir fallas en entornos autorizados; aplicar runbooks, configuraciones y mitigaciones de bajo riesgo previstas; coordinar pruebas; requerir avances a las áreas escaladas; y cerrar el ticket cuando la solución fue validada y documentada.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/1EYQPvr917Xs0lFVapdDpb69cefEux_2w/view"}, {"fileId": "1EYQPvr917Xs0lFVapdDpb69cefEux_2w", "filename": "DOC-TEC-Perfil-Soporte-Soluciones-IA-004-V1.2 - Puesto futuro - Validado por Direccion General.docx", "title": "Soporte de Soluciones IA", "section": "4. Autoridad", "paragraph": 40, "text": "Decisiones que debe consultar o escalar: Cambios de código, arquitectura o alcance; nuevas funcionalidades; uso de datos personales, sensibles o no autorizados; incidentes de seguridad; indisponibilidad generalizada; cambios destructivos o de alto impacto en producción; costos no previstos; problemas de proveedores; conflictos con clientes; y casos que excedan SLA, autoridad, capacidad o cobertura aprobada.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1EYQPvr917Xs0lFVapdDpb69cefEux_2w/view"}, {"fileId": "1EYQPvr917Xs0lFVapdDpb69cefEux_2w", "filename": "DOC-TEC-Perfil-Soporte-Soluciones-IA-004-V1.2 - Puesto futuro - Validado por Direccion General.docx", "title": "Soporte de Soluciones IA", "section": "4. Autoridad", "paragraph": 41, "text": "Recursos, presupuesto o información bajo su responsabilidad: Tickets asignados, comunicaciones, base de conocimiento, logs, telemetría y accesos autorizados. No administra presupuesto, capacidad del equipo ni compromisos comerciales.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/1EYQPvr917Xs0lFVapdDpb69cefEux_2w/view"}, {"fileId": "1EYQPvr917Xs0lFVapdDpb69cefEux_2w", "filename": "DOC-TEC-Perfil-Soporte-Soluciones-IA-004-V1.2 - Puesto futuro - Validado por Direccion General.docx", "title": "Soporte de Soluciones IA", "section": "5. Relaciones principales", "paragraph": 52, "text": "Desarrollo IA / Odoo / infraestructura", "kind": "Referencia explícita a Infraestructura / DevOps", "url": "https://drive.google.com/file/d/1EYQPvr917Xs0lFVapdDpb69cefEux_2w/view"}, {"fileId": "1EYQPvr917Xs0lFVapdDpb69cefEux_2w", "filename": "DOC-TEC-Perfil-Soporte-Soluciones-IA-004-V1.2 - Puesto futuro - Validado por Direccion General.docx", "title": "Soporte de Soluciones IA", "section": "6. Indicadores de éxito", "paragraph": 65, "text": "Continuidad y calidad de resolución", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1EYQPvr917Xs0lFVapdDpb69cefEux_2w/view"}, {"fileId": "1EYQPvr917Xs0lFVapdDpb69cefEux_2w", "filename": "DOC-TEC-Perfil-Soporte-Soluciones-IA-004-V1.2 - Puesto futuro - Validado por Direccion General.docx", "title": "Soporte de Soluciones IA", "section": "6. Indicadores de éxito", "paragraph": 67, "text": "SLA, incidentes, validaciones y reaperturas", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1EYQPvr917Xs0lFVapdDpb69cefEux_2w/view"}, {"fileId": "1EYQPvr917Xs0lFVapdDpb69cefEux_2w", "filename": "DOC-TEC-Perfil-Soporte-Soluciones-IA-004-V1.2 - Puesto futuro - Validado por Direccion General.docx", "title": "Soporte de Soluciones IA", "section": "6. Indicadores de éxito", "paragraph": 69, "text": "Sostener comunicaciones trazables y convertir hallazgos y recurrencias en conocimiento, monitoreo o acciones preventivas.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/1EYQPvr917Xs0lFVapdDpb69cefEux_2w/view"}, {"fileId": "1EYQPvr917Xs0lFVapdDpb69cefEux_2w", "filename": "DOC-TEC-Perfil-Soporte-Soluciones-IA-004-V1.2 - Puesto futuro - Validado por Direccion General.docx", "title": "Soporte de Soluciones IA", "section": "6. Indicadores de éxito", "paragraph": 70, "text": "Historial, base de conocimiento y revisiones de incidentes", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1EYQPvr917Xs0lFVapdDpb69cefEux_2w/view"}, {"fileId": "1EYQPvr917Xs0lFVapdDpb69cefEux_2w", "filename": "DOC-TEC-Perfil-Soporte-Soluciones-IA-004-V1.2 - Puesto futuro - Validado por Direccion General.docx", "title": "Soporte de Soluciones IA", "section": "7. Requisitos del puesto", "paragraph": 72, "text": "Experiencia indispensable: Experiencia comprobable en soporte técnico de aplicaciones, operación de servicios digitales, mantenimiento de integraciones o resolución de incidentes en sistemas productivos, con comunicación directa con usuarios o clientes.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1EYQPvr917Xs0lFVapdDpb69cefEux_2w/view"}, {"fileId": "1EYQPvr917Xs0lFVapdDpb69cefEux_2w", "filename": "DOC-TEC-Perfil-Soporte-Soluciones-IA-004-V1.2 - Puesto futuro - Validado por Direccion General.docx", "title": "Soporte de Soluciones IA", "section": "7. Requisitos del puesto", "paragraph": 73, "text": "Experiencia deseable: Experiencia con agentes, modelos generativos, RAG, APIs, automatizaciones, plataformas de IA, observabilidad, Odoo, contenedores y coordinación de incidentes escalados entre varias áreas.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/1EYQPvr917Xs0lFVapdDpb69cefEux_2w/view"}, {"fileId": "1EYQPvr917Xs0lFVapdDpb69cefEux_2w", "filename": "DOC-TEC-Perfil-Soporte-Soluciones-IA-004-V1.2 - Puesto futuro - Validado por Direccion General.docx", "title": "Soporte de Soluciones IA", "section": "7. Requisitos del puesto", "paragraph": 74, "text": "Conocimientos técnicos indispensables: Diagnóstico estructurado; lectura de logs y telemetría; APIs, webhooks, autenticación e integraciones; flujos de datos; configuración de agentes y prompts; evaluación de respuestas; pruebas; gestión de incidentes; documentación técnica; y fundamentos de seguridad, privacidad, disponibilidad, costo y rendimiento de soluciones de IA.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/1EYQPvr917Xs0lFVapdDpb69cefEux_2w/view"}, {"fileId": "1EYQPvr917Xs0lFVapdDpb69cefEux_2w", "filename": "DOC-TEC-Perfil-Soporte-Soluciones-IA-004-V1.2 - Puesto futuro - Validado por Direccion General.docx", "title": "Soporte de Soluciones IA", "section": "7. Requisitos del puesto", "paragraph": 75, "text": "Conocimientos deseables: Python y SQL para diagnóstico; Git; Linux; Docker; bases vectoriales; frameworks de agentes; n8n o equivalentes; colas; nube; CI/CD; herramientas de monitoreo; gestión de proveedores; y operación de ambientes de staging y producción.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/1EYQPvr917Xs0lFVapdDpb69cefEux_2w/view"}, {"fileId": "1EYQPvr917Xs0lFVapdDpb69cefEux_2w", "filename": "DOC-TEC-Perfil-Soporte-Soluciones-IA-004-V1.2 - Puesto futuro - Validado por Direccion General.docx", "title": "Soporte de Soluciones IA", "section": "9. Validación", "paragraph": 100, "text": "Documentos relacionados: Perfil del Director Técnico e IA; perfil de Desarrollador IA y esquema transitorio de soporte; perfil del Analista Funcional de Soporte; organigrama futuro; matriz Dirección–Liderazgo–Ejecución; procedimiento de soporte e incidentes de IA; SLA y criticidad; arquitectura y catálogo; políticas de datos, privacidad y seguridad; runbooks, observabilidad, base de conocimiento y matriz de escalamiento.", "kind": "Tarea, estándar o conocimiento técnico relacionado", "url": "https://drive.google.com/file/d/1EYQPvr917Xs0lFVapdDpb69cefEux_2w/view"}, {"fileId": "1sLnN7ezup5DrmczPRPCx06aVNWW4PEc5", "filename": "DOC-PC-Perfil-Responsable-People-Culture-001-V1.0 - Validado por Direccion General.docx", "title": "Responsable de People & Culture", "section": "3. Resultados y responsabilidades", "paragraph": 25, "text": "Coordinar búsquedas, altas y onboarding, asegurando que documentación, agenda, responsables, accesos e inducción estén definidos antes del ingreso.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1sLnN7ezup5DrmczPRPCx06aVNWW4PEc5/view"}, {"fileId": "1sLnN7ezup5DrmczPRPCx06aVNWW4PEc5", "filename": "DOC-PC-Perfil-Responsable-People-Culture-001-V1.0 - Validado por Direccion General.docx", "title": "Responsable de People & Culture", "section": "3. Resultados y responsabilidades", "paragraph": 34, "text": "Documentación completa y actualizada; bajas de accesos y entregas verificadas; novedades remitidas en fecha.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1sLnN7ezup5DrmczPRPCx06aVNWW4PEc5/view"}, {"fileId": "1sLnN7ezup5DrmczPRPCx06aVNWW4PEc5", "filename": "DOC-PC-Perfil-Responsable-People-Culture-001-V1.0 - Validado por Direccion General.docx", "title": "Responsable de People & Culture", "section": "4. Autoridad", "paragraph": 40, "text": "Recursos, presupuesto o información bajo su responsabilidad: Legajos y documentación confidencial, repositorio de políticas, checklists, encuestas, registros de capacitación, casos, comunicaciones, calendarios y accesos expresamente autorizados. No administra presupuesto general ni decide compensaciones.", "kind": "Contexto operativo / interfaz; no acredita responsabilidad de infraestructura", "url": "https://drive.google.com/file/d/1sLnN7ezup5DrmczPRPCx06aVNWW4PEc5/view"}, {"fileId": "17tZIf2ILQDNCDvqB7lbQRoJv1q_rynMN", "filename": "DOC-PC-Analisis-Puestos-Faltantes-001-V1.0.docx", "title": "Puestos faltantes o no explicitados", "section": "Encabezado / datos de identificación", "paragraph": 11, "text": "DevOps / Infraestructura", "kind": "Referencia explícita a Infraestructura / DevOps", "url": "https://drive.google.com/file/d/17tZIf2ILQDNCDvqB7lbQRoJv1q_rynMN/view"}], "alejandroConnections": [{"fileId": "1AStOh9WDlbuQoCGPVbnJOA5uJ7nQl_IX", "title": "Líder de Célula Odoo", "text": "visto - ok pero falta relación con infra", "author": "Alejandro Sartorio", "date": "2026-11-03T01:58:18Z", "url": "https://drive.google.com/file/d/1AStOh9WDlbuQoCGPVbnJOA5uJ7nQl_IX/view"}, {"fileId": "1RU251M_Ag9BHzm9Pgd36QGlxKlt9rizH", "title": "Líder de Soporte", "text": "visto ok - pero falta vinculo son infra y dev", "author": "Alejandro Sartorio", "date": "2026-11-03T01:59:12Z", "url": "https://drive.google.com/file/d/1RU251M_Ag9BHzm9Pgd36QGlxKlt9rizH/view"}], "proposedTitle": "Infraestructura / DevOps", "governance": "Dependencia jerárquica pendiente de definición. Dirección Técnica e IA ya gobierna infraestructura según su ficha; esto no equivale a una dependencia formal del nuevo puesto.", "classification": "Los estándares, requisitos y referencias a entornos o accesos no se reasignan automáticamente. Se excluyen respaldos contables, disponibilidad personal y competencias observables por no constituir tareas de infraestructura."}</script><script>
const infraAudit=JSON.parse(document.getElementById('infra-data').textContent);

function countEvidence(kind){return infraAudit.records.filter(r=>r.kind===kind).length;}

function showEvidence(fileId=null){selected=null;$('detail').innerHTML='<div class="eyebrow">Revisión de infraestructura</div><h2>Referencias documentales</h2><p>'+infraAudit.scope.documents+' Word revisados: '+infraAudit.scope.profiles+' fichas y un análisis de puestos faltantes. No incluye versiones OLD ni matrices de procesos.</p><p>Se distinguen referencias explícitas, contenido técnico relacionado y contexto operativo. Una mención no significa que la tarea deba trasladarse al nuevo puesto.</p><div class="infra-nav"><button id="backInfra">Ver propuesta roja</button><button id="allEvidence">Todos los documentos</button></div><div class="evidence-tools"><input type="search" id="evidenceSearch" placeholder="Filtrar referencias…" aria-label="Filtrar evidencias"><div class="muted" id="evidenceCount"></div></div><div id="evidenceList">'+infraAudit.records.filter(r=>!fileId||r.fileId===fileId).map(sourceEvidence).join('')+'</div><div class="sources">'+esc(infraAudit.classification)+'<br>Los párrafos son posiciones del texto extraído, no páginas. Se conservaron citas completas y enlaces de origen.</div>';$('backInfra').onclick=showInfra;$('allEvidence').onclick=()=>showEvidence();const f=()=>{const q=$('evidenceSearch').value.toLocaleLowerCase('es');let n=0;document.querySelectorAll('[data-evidence-search]').forEach(e=>{e.hidden=!e.dataset.evidenceSearch.includes(q);if(!e.hidden)n++;});$('evidenceCount').textContent=n+' referencias en esta vista';};$('evidenceSearch').oninput=f;f();}
function showInfra(){selected=proposalId;document.querySelectorAll('.node').forEach(e=>e.classList.toggle('selected',e.dataset.id===proposalId));$('detail').innerHTML='<div class="eyebrow" style="color:#a32b30">Puesto propuesto · No aprobado</div><h2>Infraestructura / DevOps</h2><div class="proposal-panel"><b>No existe ficha independiente</b><p>'+esc(infraAudit.finding)+'</p></div><h3>Dependencia</h3><p>'+esc(infraAudit.governance)+'</p><h3>Colaboraciones sugeridas por Alejandro</h3>'+infraAudit.alejandroConnections.map(c=>'<p><b>'+esc(c.title)+'</b></p><blockquote>'+esc(c.text)+'</blockquote><a href="'+esc(c.url)+'" target="_blank" rel="noopener">Comentario en Word ↗</a>').join('')+'<h3>Contenido para definir el puesto</h3><p>La documentación ya menciona gobierno de infraestructura y entornos, despliegues autorizados, observabilidad, monitoreo, diagnóstico y escalamiento. Esto es evidencia para redactar una ficha; no una transferencia automática de responsabilidades.</p><div class="infra-nav"><button id="allInfraEvidence" class="infra-button">Ver todas las referencias</button><button id="focusInfra">Acercar nodo rojo</button></div><p class="muted">Las líneas rojas discontinuas son propuestas de coordinación, no de reporte. No se agrega una etiqueta de Alejandro a este puesto porque él no comentó una ficha de Infraestructura.</p><div class="sources">El análisis de puestos faltantes enumera «DevOps / Infraestructura» entre los puestos previsibles al escalar.<br><a href="https://drive.google.com/file/d/17tZIf2ILQDNCDvqB7lbQRoJv1q_rynMN/view" target="_blank" rel="noopener">Abrir análisis de puestos faltantes ↗</a></div>';$('allInfraEvidence').onclick=()=>showEvidence();$('focusInfra').onclick=focusInfra;}
function focusInfra(){const v=positions.get(proposalId);if(!v)return;scale=.85;tx=$('viewport').clientWidth/2-(v.x+150)*scale;ty=$('viewport').clientHeight/2-(v.y+120)*scale;transform();}
const baseDetail=detail;detail=function(p){baseDetail(p);const n=infraAudit.records.filter(r=>r.fileId===p.id).length;if(n){$('detail').insertAdjacentHTML('beforeend','<h3>Referencias a infraestructura</h3><p>'+n+' referencias explícitas, técnicas o contextuales en esta ficha.</p><button id="profileEvidence">Ver referencias de esta ficha</button>');$('profileEvidence').onclick=()=>showEvidence(p.id);}};
const baseFilter=filter;filter=function(){baseFilter();const e=document.querySelector('[data-id="'+proposalId+'"]');if(!e)return;const q=$('search').value.toLocaleLowerCase('es').trim(),only=$('onlyComments').checked;const match=!only&&(!q||('infraestructura devops propuesto '+infraAudit.alejandroConnections.map(c=>c.text).join(' ')).includes(q));e.classList.toggle('dim',Boolean((q||only)&&!match));e.classList.toggle('match',Boolean(q&&match));$('results').textContent+=' + 1 propuesta';};
const baseRender=render;render=function(refit=false){baseRender(false);const branch=positions.get(infraAudit.alejandroConnections[0].fileId);const x=size.w+70,y=branch?branch.y:1020;positions.set(proposalId,{x,y,p:{id:proposalId,title:'Infraestructura / DevOps',proposed:true,reference:true,comments:[],area:'Propuesta'}});$('nodes').insertAdjacentHTML('beforeend','<button class="node proposed" data-id="'+proposalId+'" style="left:'+x+'px;top:'+y+'px" aria-label="Infraestructura / DevOps, puesto propuesto"><span class="area">Función transversal · Sin ficha</span><span class="title">Infraestructura / DevOps</span><span class="proposal-label">PROPUESTA · NO APROBADA</span><span class="proposal-note">Colaboración con Líder de Célula Odoo y Líder de Soporte.<br>Dependencia jerárquica por definir.</span></button>');document.querySelector('[data-id="'+proposalId+'"]').onclick=showInfra;const extra=infraAudit.alejandroConnections.map((c,i)=>{const target=positions.get(c.fileId),el=document.querySelector('[data-id="'+c.fileId+'"]');if(!target||!el)return '';const sx=x+135+i*20,sy=y,bus=Math.min(y,target.y)-45-i*15,ex=target.x+300,ey=target.y+el.offsetHeight/2;return '<path class="infra-link" data-source="'+proposalId+'" data-target="'+c.fileId+'" d="M '+sx+' '+sy+' V '+bus+' H '+(ex+14+i*3)+' V '+ey+' H '+ex+'" fill="none" stroke="#c33136" stroke-width="2.6" stroke-dasharray="9 6"><title>Colaboración propuesta: '+esc(c.title)+' — '+esc(c.text)+'</title></path>';}).join('');$('links').insertAdjacentHTML('beforeend',extra);size.w=x+330;size.h=Math.max(size.h,y+260);$('world').style.width=size.w+'px';$('world').style.height=size.h+'px';$('links').setAttribute('width',size.w);$('links').setAttribute('height',size.h);filter();if(refit)fit();};
$('infraAudit').onclick=showInfra;
$('search').removeEventListener('input',baseFilter);$('search').addEventListener('input',filter);$('onlyComments').removeEventListener('change',baseFilter);$('onlyComments').addEventListener('change',filter);
